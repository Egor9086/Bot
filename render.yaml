services:
  - type: worker            # polling-бот: порт не нужен
    name: onepiece-bot
    runtime: python
    plan: starter           # диск доступен только на платных планах
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BOT_TOKEN
        sync: false         # введёте в панели Render
      - key: ADMIN_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false         # токен GitHub с правом gist
      - key: GIST_ID
        sync: false         # ID секретного gist для хранения прогресса
      - key: DB_PATH
        value: /var/data/one_piece_game.db
      - key: NOTIFY_ON_START
        value: "0"
      - key: NOTIFY_ON_STOP
        value: "0"
    disk:
      name: botdata
      mountPath: /var/data
      sizeGB: 1
